<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirm">Delete</button>
  <div class="modal fade" id="confirm" tabindex="-1"><div class="modal-dialog">
    <div class="modal-content">
	  <div class="modal-header"><h5 class="modal-title">Delete file?</h5>
	  <button class="btn-close" data-bs-dismiss="modal"></button></div>
	<div class="modal-body">This cannot be undone.</div>
	<div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
	  <button class="btn btn-danger">Delete</button></div>
	  </div></div></div                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     >
	  </body>
</html>
